name: Android CI

on:
  push:
    branches: [main, "claude/**", "chatgpt/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --stacktrace test

      - name: APK de debug
        run: ./gradlew --stacktrace assembleDebug

      - name: APK release (vérifie R8 et la taille finale)
        run: ./gradlew --stacktrace assembleRelease

      - name: Taille des APK
        run: |
          echo "### Taille des APK" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -exec du -h {} \; | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: lionne-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
