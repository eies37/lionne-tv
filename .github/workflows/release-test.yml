name: APK de test publié

# Publie un APK de test téléchargeable directement depuis la TV
# quand on pousse une étiquette, par exemple : git tag v0.1.0-test1 && git push origin v0.1.0-test1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK
        run: ./gradlew --stacktrace test assembleDebug

      - name: APK release signé (si la clé est configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.LIONNE_KEYSTORE_BASE64 }}
          LIONNE_KEYSTORE_PASSWORD: ${{ secrets.LIONNE_KEYSTORE_PASSWORD }}
          LIONNE_KEY_ALIAS: ${{ secrets.LIONNE_KEY_ALIAS }}
          LIONNE_KEY_PASSWORD: ${{ secrets.LIONNE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas de clé de signature configurée : seul l'APK de test est publié."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lionne.jks"
          LIONNE_KEYSTORE_FILE="$RUNNER_TEMP/lionne.jks" ./gradlew --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk lionne-tv-release.apk

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk lionne-tv.apk
          files="lionne-tv.apk"
          [ -f lionne-tv-release.apk ] && files="$files lionne-tv-release.apk"
          gh release create "$GITHUB_REF_NAME" $files \
            --prerelease \
            --title "Lionne TV $GITHUB_REF_NAME (test)" \
            --notes "APK de test (debug, non signé pour le Play Store). Sur la TV, avec l'application Downloader : https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/lionne-tv.apk"
